<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5cff">

  <title>Create Account | Mule QuickFix</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
      min-height: 100vh;
    }

    .header {
      background: #ffffff;
      border-bottom: 1px solid #e7ebf2;
      padding: 14px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #0b5cff;
      font-weight: 800;
      text-decoration: none;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #0b5cff;
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .page {
      max-width: 520px;
      margin: auto;
      padding: 30px 18px 45px;
    }

    .back {
      display: inline-block;
      color: #637087;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e6eaf1;
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 10px 30px rgba(23, 32, 51, .05);
    }

    .card h1 {
      font-size: 27px;
      margin-bottom: 7px;
    }

    .intro {
      color: #6c778c;
      font-size: 14px;
      margin-bottom: 23px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #dce2eb;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
    }

    input:focus,
    select:focus {
      border-color: #0b5cff;
      box-shadow: 0 0 0 3px rgba(11, 92, 255, .08);
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 17px 0;
      font-size: 12px;
      color: #69758a;
    }

    .terms input {
      width: auto;
      margin-top: 2px;
    }

    .submit {
      width: 100%;
      border: 0;
      background: #0b5cff;
      color: #ffffff;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
      border: 1px solid #ffd2d2;
    }

    .message.success {
      display: block;
      background: #effaf2;
      color: #18743a;
      border: 1px solid #c9efd2;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #6d788d;
      font-size: 14px;
    }

    .login a {
      color: #0b5cff;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header class="header">
  <a href="index.html" class="brand">
    <div class="logo">🔧</div>
    <span>MULE QUICKFIX</span>
  </a>
</header>

<main class="page">

  <a href="index.html" class="back">← Back to home</a>

  <section class="card">

    <h1>Create your account</h1>

    <p class="intro">
      Create a Mule QuickFix customer account and request
      a service professional when you need one.
    </p>

    <div id="message" class="message"></div>

    <form id="registerForm">

      <div class="form-group">
        <label for="fullName">Full name</label>
        <input
          id="fullName"
          type="text"
          placeholder="Enter your full name"
          required
        >
      </div>

      <div class="form-group">
        <label for="phone">Phone number</label>
        <input
          id="phone"
          type="tel"
          placeholder="0971234567"
          required
        >
      </div>

      <div class="form-group">
        <label for="city">City</label>

        <select id="city" required>
          <option value="">Select your city</option>
          <option value="Kitwe">Kitwe</option>
          <option value="Ndola">Ndola</option>
          <option value="Lusaka">Lusaka</option>
          <option value="Chingola">Chingola</option>
          <option value="Mufulira">Mufulira</option>
          <option value="Livingstone">Livingstone</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="email">Email address</label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          placeholder="Minimum 6 characters"
          minlength="6"
          required
        >
      </div>

      <div class="terms">
        <input id="terms" type="checkbox" required>

        <label for="terms">
          I agree to use Mule QuickFix responsibly and provide
          accurate information when requesting services.
        </label>
      </div>

      <button type="submit" class="submit" id="submitBtn">
        Create Account
      </button>

    </form>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </section>

</main>

<script type="module">

  import { auth, db } from "./js/firebase.js";

  import {
    createUserWithEmailAndPassword,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    ref,
    set
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


  const form = document.getElementById("registerForm");
  const message = document.getElementById("message");
  const submitBtn = document.getElementById("submitBtn");


  function showMessage(text, type) {

    message.textContent = text;

    message.className = "message " + type;

  }


  form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const fullName =
      document.getElementById("fullName").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const city =
      document.getElementById("city").value;

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    if (password.length < 6) {

      showMessage(
        "Password must contain at least 6 characters.",
        "error"
      );

      return;
    }


    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account...";


    try {

      const userCredential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user = userCredential.user;


      await updateProfile(user, {
        displayName: fullName
      });


      await set(
        ref(db, "users/" + user.uid),
        {

          uid: user.uid,

          fullName: fullName,

          phone: phone,

          email: email,

          city: city,

          role: "customer",

          status: "active",

          createdAt: Date.now()

        }
      );


      showMessage(
        "Account created successfully! Redirecting...",
        "success"
      );


      setTimeout(() => {

        window.location.href = "login.html";

      }, 1500);


    } catch (error) {

      console.error(error);

      let errorMessage =
        "Unable to create your account. Please try again.";


      if (error.code === "auth/email-already-in-use") {

        errorMessage =
          "This email address is already registered.";

      }

      if (error.code === "auth/invalid-email") {

        errorMessage =
          "Please enter a valid email address.";

      }

      if (error.code === "auth/weak-password") {

        errorMessage =
          "Please choose a stronger password.";

      }


      showMessage(errorMessage, "error");

      submitBtn.disabled = false;
      submitBtn.textContent = "Create Account";

    }

  });

</script>

</body>
</html>

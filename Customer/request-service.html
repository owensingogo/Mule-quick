<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b8f">
<title>Request Service | Mule QuickFix</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fc;color:#172033}
header{background:#173b8f;color:#fff;padding:15px;font-weight:800}
main{max-width:600px;margin:auto;padding:18px 12px}
.box{background:#fff;padding:18px;border-radius:16px;box-shadow:0 3px 15px #0001}
h1{margin:0 0 5px;font-size:22px}.sub{color:#667085;font-size:12px;margin-bottom:18px}
label{display:block;font-size:12px;font-weight:bold;margin:11px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d7ddea;border-radius:9px;font-size:14px}
textarea{min-height:90px;resize:vertical}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#173b8f;color:#fff;font-weight:bold;margin-top:15px}
.price{background:#eef3ff;padding:11px;border-radius:9px;margin-top:12px;font-size:13px}
.note{font-size:11px;color:#667085;margin-top:10px;line-height:1.5}
#msg{display:none;padding:10px;border-radius:9px;margin-bottom:10px;font-size:12px}
.ok{display:block;background:#e8f7ed;color:#176b39}.err{display:block;background:#ffeaea;color:#a00}
</style>
</head>
<body>

<header>🔧 MULE QUICKFIX</header>

<main>
<div class="box">
<h1>Request a Service</h1>
<div class="sub">Tell us what you need and we'll connect you with an approved technician.</div>

<div id="msg"></div>

<form id="form">

<label>Service</label>
<select id="service" required>
<option value="">Select service</option>
<option>Plumbing</option>
<option>Electrical</option>
<option>Mechanics</option>
<option>Phone Repair</option>
<option>Computer Repair</option>
<option>Locksmith</option>
<option>Other</option>
</select>

<label>Description</label>
<textarea id="description" placeholder="Describe the problem..." required></textarea>

<label>Your Phone Number</label>
<input id="phone" type="tel" placeholder="097xxxxxxx" required>

<label>Location</label>
<input id="location" placeholder="House, street or landmark" required>

<label>City</label>
<select id="city" required>
<option value="">Select city</option>
<option>Kitwe</option>
<option>Ndola</option>
<option>Lusaka</option>
<option>Chingola</option>
<option>Mufulira</option>
<option>Livingstone</option>
<option>Other</option>
</select>

<label>Your Budget (Optional)</label>
<input id="budget" type="number" min="0" placeholder="e.g. 300">

<label>Urgency</label>
<select id="urgency">
<option value="normal">Normal</option>
<option value="urgent">Urgent</option>
<option value="emergency">Emergency</option>
</select>

<div class="price">
Starting price: <b id="price">K0.00</b>
</div>

<div class="note">
🔒 Your phone number is protected. It is stored separately and is only accessible to Mule QuickFix management.
</div>

<button type="submit">🚀 SUBMIT REQUEST</button>
</form>
</div>
</main>

<script type="module">
import{auth,db}from"../js/firebase.js";
import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{ref,get,push,set}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const prices={Plumbing:150,Electrical:150,Mechanics:200,"Phone Repair":100,"Computer Repair":150,Locksmith:150,Other:150};
const $=id=>document.getElementById(id);
let userData=null;

function show(t,e=false){
 $("msg").textContent=t;
 $("msg").className=e?"err":"ok";
}

$("service").onchange=()=>{
 let p=prices[$("service").value]||0;
 $("price").textContent="K"+p.toFixed(2);
};

onAuthStateChanged(auth,async user=>{
 if(!user){location.href="../login.html";return}
 let s=await get(ref(db,"users/"+user.uid));
 userData=s.val()||{};
 if(userData.role!=="customer"){
   location.href="../login.html";
   return;
 }
 $("phone").value=userData.phone||"";
 $("city").value=userData.city||"";
});

$("form").onsubmit=async e=>{
 e.preventDefault();

 let user=auth.currentUser;
 if(!user)return;

 let service=$("service").value;
 let description=$("description").value.trim();
 let phone=$("phone").value.trim();
 let locationText=$("location").value.trim();
 let city=$("city").value;
 let urgency=$("urgency").value;
 let budget=Number($("budget").value||0);
 let base=Number(prices[service]||150);
 let commission=base*.15;

 if(!service||!description||!phone||!locationText||!city){
   show("Please complete all required fields.",true);
   return;
 }

 try{
   let jobRef=push(ref(db,"jobs"));
   let id=jobRef.key;

   await set(jobRef,{
     id,
     customerId:user.uid,
     customerName:userData.fullName||user.displayName||"Customer",
     service,
     description,
     location:locationText,
     city,
     urgency,
     customerBudget:budget,
     estimatedPrice:base,
     platformCommission:commission,
     technicianAmount:base-commission,
     commissionType:"percentage",
     commissionRate:15,
     status:"pending",
     technicianId:null,
     technicianName:null,
     paymentStatus:"unpaid",
     commissionStatus:"unpaid",
     commissionPaymentReference:null,
     commissionPaidAt:null,
     createdAt:Date.now(),
     updatedAt:Date.now()
   });

   await set(ref(db,"customerPhones/"+id),{
     customerId:user.uid,
     phone,
     createdAt:Date.now()
   });

   show("✅ Request submitted successfully.");

   setTimeout(()=>location.href="dashboard.html",1200);

 }catch(err){
   console.error(err);
   show("Unable to submit request. Please try again.",true);
 }
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mule QuickFix | Request Service</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}
header{background:#0b5cff;color:white;padding:15px;font-weight:900}
main{max-width:600px;margin:auto;padding:15px}
.card{background:white;padding:16px;border-radius:15px;box-shadow:0 3px 15px #0001}
h2{margin:0 0 5px}.sub{font-size:12px;color:#667085;margin-bottom:15px}
label{font-size:12px;font-weight:bold;display:block;margin-top:10px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d8dee8;border-radius:8px;margin-top:5px;font-size:14px}
textarea{min-height:100px;resize:vertical}
button{width:100%;padding:12px;border:0;border-radius:9px;background:#0b5cff;color:white;font-weight:bold;margin-top:15px}
.back{background:#eef2f7;color:#344054}
.note{font-size:11px;background:#eff6ff;padding:10px;border-radius:8px;margin-top:12px;color:#175cd3}
.success,.error{display:none;padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px}
.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}
</style>
</head>

<body>

<header>🔧 MULE QUICKFIX</header>

<main>

<div id="success" class="success"></div>
<div id="error" class="error"></div>

<div class="card">

<h2>Request a Service</h2>
<div class="sub">Tell us what you need and a qualified technician can assist you.</div>

<label>Service</label>
<select id="service">
<option value="">Select service</option>
<option>Plumbing</option>
<option>Electrical</option>
<option>Mechanics</option>
<option>Phone Repair</option>
<option>Computer Repair</option>
<option>Locksmith</option>
<option>Other</option>
</select>

<label>Describe the problem</label>
<textarea id="description" placeholder="Explain what you need help with..."></textarea>

<label>Location</label>
<input id="location" placeholder="House, street or landmark">

<label>City</label>
<select id="city">
<option value="">Select city</option>
<option>Kitwe</option>
<option>Ndola</option>
<option>Lusaka</option>
<option>Chingola</option>
<option>Mufulira</option>
<option>Livingstone</option>
<option>Other</option>
</select>

<label>Contact Phone</label>
<input id="phone" type="tel" placeholder="097XXXXXXX">

<label>Urgency</label>
<select id="urgency">
<option value="normal">Normal</option>
<option value="urgent">Urgent</option>
<option value="emergency">Emergency</option>
</select>

<div class="note">
💡 The final service price is determined after the job details are reviewed. You will be informed of the price before payment.
</div>

<button id="submit">🚀 Submit Service Request</button>
<button class="back" onclick="history.back()">← Back</button>

</div>
</main>

<script type="module">

import{auth,db}from"../js/firebase.js";
import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{ref,push,set}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const $=id=>document.getElementById(id);

function show(type,text){
$(type).textContent=text;
$(type).style.display="block";
setTimeout(()=>$(type).style.display="none",4000);
}

let user=null;

onAuthStateChanged(auth,u=>{
if(!u){
location.href="../login.html";
return;
}
user=u;
});

$("submit").onclick=async()=>{

if(!user){
show("error","Please log in first.");
return;
}

let service=$("service").value;
let description=$("description").value.trim();
let location=$("location").value.trim();
let city=$("city").value;
let phone=$("phone").value.trim();
let urgency=$("urgency").value;

if(!service||!description||!location||!city||!phone){
show("error","Please complete all required fields.");
return;
}

let btn=$("submit");
btn.disabled=true;
btn.textContent="Submitting...";

try{

let jobRef=push(ref(db,"jobs"));

await set(jobRef,{

id:jobRef.key,

customerId:user.uid,
customerName:user.displayName||"Customer",
customerPhone:phone,

service,
description,
location,
city,
urgency,

status:"pending",

technicianId:null,
technicianName:null,

estimatedPrice:0,
platformCommission:0,
technicianAmount:0,

paymentStatus:"unpaid",

createdAt:Date.now(),
updatedAt:Date.now()

});

show("success","✅ Request submitted successfully!");

$("service").value="";
$("description").value="";
$("location").value="";
$("city").value="";
$("phone").value="";
$("urgency").value="normal";

setTimeout(()=>{
location.href="dashboard.html";
},1500);

}catch(e){

show("error","Could not submit request: "+e.message);
btn.disabled=false;
btn.textContent="🚀 Submit Service Request";

}

};

</script>

</body>
</html>

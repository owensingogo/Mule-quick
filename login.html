<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5cff">
<title>Login | Mule QuickFix</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e7ebf2;padding:14px 18px}
.brand{display:flex;align-items:center;gap:10px;color:#0b5cff;font-weight:800;text-decoration:none}
.logo{width:40px;height:40px;border-radius:12px;background:#0b5cff;color:#fff;display:grid;place-items:center;font-size:20px}
.page{max-width:500px;margin:auto;padding:35px 18px}
.back{display:inline-block;color:#68738a;text-decoration:none;font-size:14px;margin-bottom:20px}
.card{background:#fff;border:1px solid #e5e9f1;border-radius:20px;padding:26px 20px;box-shadow:0 12px 30px #17203310}
h1{font-size:28px;margin-bottom:7px}
.intro{color:#6c778c;font-size:14px;margin-bottom:24px}
.form-group{margin-bottom:17px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
input{width:100%;padding:14px;border:1px solid #dce2eb;border-radius:11px;font-size:15px;outline:none}
input:focus{border-color:#0b5cff}
.password-row{position:relative}
.password-row input{padding-right:70px}
.show-password{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#0b5cff;font-size:12px;font-weight:700}
.submit{width:100%;border:0;background:#0b5cff;color:#fff;padding:15px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer}
.submit:disabled{opacity:.6}
.message{display:none;padding:12px;border-radius:10px;margin-bottom:16px;font-size:13px}
.message.error{display:block;background:#fff0f0;color:#b42318}
.message.success{display:block;background:#effaf2;color:#18743a}
.links{display:flex;justify-content:space-between;gap:10px;margin-top:18px;font-size:13px}
.links a,.register a{color:#0b5cff;font-weight:700;text-decoration:none}
.register{text-align:center;margin-top:22px;color:#6d788d;font-size:14px}
</style>
</head>
<body>

<header class="header">
<a href="index.html" class="brand">
<div class="logo">🔧</div>
<span>MULE QUICKFIX</span>
</a>
</header>

<main class="page">
<a href="index.html" class="back">← Back to home</a>

<section class="card">
<h1>Welcome back</h1>
<p class="intro">Login to request and manage your Mule QuickFix services.</p>

<div id="message" class="message"></div>

<form id="loginForm">

<div class="form-group">
<label>Email address</label>
<input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
</div>

<div class="form-group">
<label>Password</label>
<div class="password-row">
<input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
<button type="button" class="show-password" id="showPassword">Show</button>
</div>
</div>

<button type="submit" class="submit" id="submitBtn">Login</button>
</form>

<div class="links">
<a href="#" id="forgotPassword">Forgot password?</a>
<a href="technician-register.html">Technician?</a>
</div>

<div class="register">
Don't have an account?
<a href="register.html">Create one</a>
</div>

</section>
</main>

<script type="module">
import{auth,db}from"./js/firebase.js";
import{signInWithEmailAndPassword,sendPasswordResetEmail,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{ref,get,update}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const CEO_UID="ErJbrmeB4ARtVr5n9G7FxYEZxVa2";
const $=id=>document.getElementById(id);
const form=$("loginForm"),message=$("message"),btn=$("submitBtn"),pass=$("password");

function msg(text,type){
message.textContent=text;
message.className="message "+type;
}

$("showPassword").onclick=()=>{
pass.type=pass.type==="password"?"text":"password";
$("showPassword").textContent=pass.type==="password"?"Show":"Hide";
};

form.onsubmit=async e=>{
e.preventDefault();

const email=$("email").value.trim();
const password=pass.value;

btn.disabled=true;
btn.textContent="Logging in...";

try{
const c=await signInWithEmailAndPassword(auth,email,password);
const user=c.user;

if(user.uid===CEO_UID){

await update(ref(db,"users/"+CEO_UID),{
uid:CEO_UID,
email:user.email||"",
fullName:user.displayName||"Owen Singogo",
role:"admin",
status:"active",
updatedAt:Date.now()
});

msg("CEO account verified. Opening dashboard...","success");

setTimeout(()=>{
location.href="ceo-dashboard.html";
},500);

return;
}

const s=await get(ref(db,"users/"+user.uid));

if(!s.exists()){
msg("Your account information could not be found. Please contact Mule QuickFix support.","error");
await signOut(auth);
btn.disabled=false;
btn.textContent="Login";
return;
}

const u=s.val();

if(u.status==="suspended"){
msg("Your account has been suspended. Please contact Mule QuickFix support.","error");
await signOut(auth);
btn.disabled=false;
btn.textContent="Login";
return;
}

if(u.role==="technician"&&u.status!=="approved"){
msg("Your technician account is still pending approval.","error");
await signOut(auth);
btn.disabled=false;
btn.textContent="Login";
return;
}

msg("Login successful. Opening your dashboard...","success");

setTimeout(()=>{
if(u.role==="technician"){
location.href="technician-dashboard.html";
}else if(u.role==="admin"){
location.href="ceo-dashboard.html";
}else{
location.href="customer-dashboard.html";
}
},500);

}catch(error){

console.error(error);

let text="Login failed. Please check your details.";

if(["auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(error.code))
text="Incorrect email or password.";

if(error.code==="auth/too-many-requests")
text="Too many attempts. Please wait and try again.";

msg(text,"error");

btn.disabled=false;
btn.textContent="Login";
}
};

$("forgotPassword").onclick=async e=>{
e.preventDefault();

const email=$("email").value.trim();

if(!email){
msg("Enter your email address first.","error");
return;
}

try{
await sendPasswordResetEmail(auth,email);
msg("Password reset instructions have been sent to your email.","success");
}catch(error){
msg("Unable to send the reset email. Check the email address and try again.","error");
}
};
</script>

</body>
  </html>

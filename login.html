<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5cff">

  <title>Login | Mule QuickFix</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
      min-height: 100vh;
    }

    .header {
      background: #fff;
      border-bottom: 1px solid #e7ebf2;
      padding: 14px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #0b5cff;
      font-weight: 800;
      text-decoration: none;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #0b5cff;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .page {
      max-width: 500px;
      margin: auto;
      padding: 35px 18px;
    }

    .back {
      display: inline-block;
      color: #68738a;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e9f1;
      border-radius: 20px;
      padding: 26px 20px;
      box-shadow: 0 12px 30px rgba(23, 32, 51, .06);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .intro {
      color: #6c778c;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dce2eb;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #0b5cff;
      box-shadow: 0 0 0 3px rgba(11, 92, 255, .08);
    }

    .password-row {
      position: relative;
    }

    .password-row input {
      padding-right: 70px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #0b5cff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit {
      width: 100%;
      border: 0;
      background: #0b5cff;
      color: #fff;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
    }

    .submit:disabled {
      opacity: .6;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
      border: 1px solid #ffd2d2;
    }

    .message.success {
      display: block;
      background: #effaf2;
      color: #18743a;
      border: 1px solid #c9efd2;
    }

    .links {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
      font-size: 13px;
    }

    .links a {
      color: #0b5cff;
      font-weight: 700;
      text-decoration: none;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      color: #6d788d;
      font-size: 14px;
    }

    .register a {
      color: #0b5cff;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header class="header">
  <a href="index.html" class="brand">
    <div class="logo">🔧</div>
    <span>MULE QUICKFIX</span>
  </a>
</header>

<main class="page">

  <a href="index.html" class="back">← Back to home</a>

  <section class="card">

    <h1>Welcome back</h1>

    <p class="intro">
      Login to request and manage your Mule QuickFix services.
    </p>

    <div id="message" class="message"></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email address</label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-row">

          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            Show
          </button>

        </div>
      </div>

      <button
        type="submit"
        class="submit"
        id="submitBtn"
      >
        Login
      </button>

    </form>

    <div class="links">
      <a href="#" id="forgotPassword">
        Forgot password?
      </a>

      <a href="technician/register.html">
        Technician?
      </a>
    </div>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create one</a>
    </div>

  </section>

</main>

<script type="module">

  import { auth, db } from "./js/firebase.js";

  import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    ref,
    get
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");
  const submitBtn = document.getElementById("submitBtn");

  const passwordInput =
    document.getElementById("password");

  const showPassword =
    document.getElementById("showPassword");


  function showMessage(text, type) {

    message.textContent = text;
    message.className = "message " + type;

  }


  showPassword.addEventListener("click", () => {

    if (passwordInput.type === "password") {

      passwordInput.type = "text";
      showPassword.textContent = "Hide";

    } else {

      passwordInput.type = "password";
      showPassword.textContent = "Show";

    }

  });


  form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      passwordInput.value;


    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in...";


    try {

      const userCredential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      const user = userCredential.user;


      const snapshot =
        await get(ref(db, "users/" + user.uid));


      if (!snapshot.exists()) {

        showMessage(
          "Your account information could not be found.",
          "error"
        );

        await auth.signOut();

        submitBtn.disabled = false;
        submitBtn.textContent = "Login";

        return;
      }


      const userData = snapshot.val();


      if (userData.status === "suspended") {

        showMessage(
          "Your account has been suspended. Please contact Mule QuickFix support.",
          "error"
        );

        await auth.signOut();

        submitBtn.disabled = false;
        submitBtn.textContent = "Login";

        return;
      }


      showMessage(
        "Login successful. Opening your dashboard...",
        "success"
      );


      setTimeout(() => {

        if (userData.role === "technician") {

          window.location.href =
            "technician/dashboard.html";

        } else if (userData.role === "admin") {

          window.location.href =
            "ceo/dashboard.html";

        } else {

          window.location.href =
            "customer/dashboard.html";

        }

      }, 800);


    } catch (error) {

      console.error(error);

      let errorMessage =
        "Login failed. Please check your details.";

      if (
        error.code === "auth/invalid-credential" ||
        error.code === "auth/wrong-password" ||
        error.code === "auth/user-not-found"
      ) {

        errorMessage =
          "Incorrect email or password.";

      }

      if (error.code === "auth/too-many-requests") {

        errorMessage =
          "Too many attempts. Please wait and try again.";

      }


      showMessage(errorMessage, "error");

      submitBtn.disabled = false;
      submitBtn.textContent = "Login";

    }

  });


  document
    .getElementById("forgotPassword")
    .addEventListener("click", async (event) => {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();


      if (!email) {

        showMessage(
          "Enter your email address first.",
          "error"
        );

        return;
      }


      try {

        await sendPasswordResetEmail(
          auth,
          email
        );

        showMessage(
          "Password reset instructions have been sent to your email.",
          "success"
        );

      } catch (error) {

        console.error(error);

        showMessage(
          "Unable to send the reset email. Check the email address and try again.",
          "error"
        );

      }

    });

</script>

</body>
</html>

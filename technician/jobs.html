<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#173b8f">
<title>My Jobs | Mule QuickFix</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fc;color:#172033}
header{background:#173b8f;color:#fff;padding:15px;position:sticky;top:0;z-index:10}
.head{max-width:700px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:18px}
.back{color:#fff;text-decoration:none;font-size:14px}
main{max-width:700px;margin:auto;padding:15px 12px 35px}
h1{font-size:23px;margin:5px 0}
.sub{font-size:13px;color:#667085;margin-bottom:15px}
.tabs{display:flex;gap:7px;margin-bottom:15px}
.tab{flex:1;border:0;background:#fff;color:#173b8f;padding:11px 5px;border-radius:10px;font-weight:700;font-size:12px}
.tab.active{background:#173b8f;color:#fff}
.card{background:#fff;border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.top{display:flex;justify-content:space-between;gap:10px}
.service{font-size:17px;font-weight:800;color:#173b8f}
.badge{padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap}
.normal{background:#eaf1ff;color:#173b8f}
.urgent{background:#fff1d6;color:#9a6100}
.emergency{background:#ffe4e4;color:#b51f1f}
.row{font-size:13px;margin-top:9px;line-height:1.5}
.row b{color:#344054}
.money{background:#f5f8ff;border-radius:11px;padding:11px;margin-top:12px;font-size:13px;line-height:1.7}
.money strong{color:#173b8f}
.protected{background:#fff8e7;border:1px solid #f1df9b;color:#735600;padding:12px;border-radius:11px;margin-top:12px;font-size:12px;line-height:1.5}
button.action{width:100%;border:0;border-radius:11px;padding:13px;margin-top:11px;background:#173b8f;color:#fff;font-weight:800;font-size:13px}
button.green{background:#198754}
button.orange{background:#c47a00}
button.red{background:#b42318}
button:disabled{opacity:.55}
.empty{text-align:center;padding:35px 15px;color:#667085;background:#fff;border-radius:16px}
.msg{display:none;padding:12px;border-radius:10px;margin-bottom:14px;font-size:13px}
.success{display:block;background:#e9f8ef;color:#176b39}
.error{display:block;background:#fff0f0;color:#a52323}
.loading{text-align:center;padding:25px;color:#667085}
</style>
</head>

<body>

<header>
<div class="head">
<div class="logo">🔧 MULE QUICKFIX</div>
<a class="back" href="dashboard.html">← Dashboard</a>
</div>
</header>

<main>

<h1>My Jobs</h1>
<div class="sub">
Manage accepted jobs, complete your work and submit your Mule QuickFix commission.
</div>

<div id="msg" class="msg"></div>

<div class="tabs">
<button class="tab active" data-tab="active">ACTIVE</button>
<button class="tab" data-tab="progress">IN PROGRESS</button>
<button class="tab" data-tab="completed">COMPLETED</button>
</div>

<div id="jobs">
<div class="loading">Loading your jobs...</div>
</div>

</main>

<script type="module">

import {auth,db} from "../js/firebase.js";

import {
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
 ref,
 onValue,
 update,
 get
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const MANAGER_PHONES=[
 "260972632701",
 "260768217115"
];

const jobsBox=document.getElementById("jobs");
const msg=document.getElementById("msg");

let currentUser=null;
let allJobs=[];
let currentTab="active";


function showMsg(type,text){

 msg.className="msg "+type;
 msg.textContent=text;
 msg.style.display="block";

 setTimeout(()=>{
   msg.style.display="none";
 },4000);

}


function esc(value){

 return String(value??"")
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")
   .replace(/>/g,"&gt;")
   .replace(/"/g,"&quot;")
   .replace(/'/g,"&#039;");

}


function money(value){

 return "K"+Number(value||0).toFixed(2);

}


function statusClass(status){

 if(status==="emergency")return"emergency";
 if(status==="urgent")return"urgent";
 return"normal";

}


function statusText(status){

 if(status==="in_progress")return"IN PROGRESS";
 if(status==="completed")return"COMPLETED";
 if(status==="accepted")return"ACCEPTED";
 return String(status||"ACTIVE").toUpperCase();

}


function render(){

 let filtered=allJobs.filter(j=>{

   if(currentTab==="active")
     return j.status==="accepted";

   if(currentTab==="progress")
     return j.status==="in_progress";

   if(currentTab==="completed")
     return j.status==="completed";

   return false;

 });


 if(!filtered.length){

   jobsBox.innerHTML=`
   <div class="empty">
     <div style="font-size:35px">📋</div>
     <h3>No ${currentTab==="progress"?"in-progress":currentTab} jobs</h3>
     <p>Your jobs will appear here when available.</p>
   </div>`;

   return;

 }


 jobsBox.innerHTML=filtered
 .sort((a,b)=>
   Number(b.createdAt||0)-Number(a.createdAt||0)
 )
 .map(j=>card(j))
 .join("");

}


function card(j){

 const urgency=j.urgency||"normal";

 const commission=
   Number(j.platformCommission||0);

 const technicianAmount=
   Number(j.technicianAmount||0);

 let buttons="";


 if(j.status==="accepted"){

   buttons=`
   <button class="action green"
   onclick="startJob('${esc(j.id)}')">
   ▶ START JOB
   </button>`;

 }


 if(j.status==="in_progress"){

   buttons=`
   <button class="action green"
   onclick="completeJob('${esc(j.id)}')">
   ✓ COMPLETE JOB
   </button>`;

 }


 if(j.status==="completed"){

   if(j.commissionStatus==="paid"){

     buttons=`
     <button class="action" disabled>
     ✓ COMMISSION PAID
     </button>`;

   }else if(j.commissionStatus==="pending"){

     buttons=`
     <button class="action orange" disabled>
     ⏳ COMMISSION PAYMENT PENDING CEO CONFIRMATION
     </button>`;

   }else{

     buttons=`
     <button class="action orange"
     onclick="payCommission('${esc(j.id)}')">
     💰 PAY MULE QUICKFIX COMMISSION
     </button>`;

   }

 }


 return`

 <div class="card">

   <div class="top">

     <div class="service">
       ${esc(j.service||"Service")}
     </div>

     <div class="badge ${statusClass(urgency)}">
       ${esc(urgency.toUpperCase())}
     </div>

   </div>

   <div class="row">
     <b>Status:</b> ${statusText(j.status)}
   </div>

   <div class="row">
     <b>Location:</b> ${esc(j.location||"Not provided")}
   </div>

   <div class="row">
     <b>City:</b> ${esc(j.city||"Not provided")}
   </div>

   <div class="row">
     <b>Problem:</b><br>
     ${esc(j.description||"No description")}
   </div>

   <div class="row">
     <b>Customer Budget:</b>
     ${j.customerBudget?
       money(j.customerBudget):
       "Not provided"}
   </div>

   <div class="protected">

     🔒 <b>Customer Contact Protected</b><br><br>

     The customer's phone number is not displayed
     in your technician account.

     <br><br>

     After accepting this job, call a Mule QuickFix
     Manager to receive the customer's contact number
     and any necessary job instructions.

     <button class="action"
     onclick="callManager()">
     📞 CALL MULE QUICKFIX MANAGER
     </button>

   </div>

   <div class="money">

     <b>Job Financial Details</b><br>

     Final Job Price:
     <strong>${money(j.estimatedPrice)}</strong><br>

     Mule QuickFix Commission:
     <strong>${money(commission)}</strong><br>

     Your Expected Earnings:
     <strong>${money(technicianAmount)}</strong><br>

     Commission Status:
     <strong>
     ${esc(j.commissionStatus||"unpaid").toUpperCase()}
     </strong>

   </div>

   ${buttons}

 </div>

 `;

}


window.callManager=function(){

 const choice=confirm(
   "MULE QUICKFIX MANAGER\n\n"+
   "Manager 1: 0972632701\n\n"+
   "Press OK to call Manager 1.\n"+
   "Press Cancel to call Manager 2: 0768217115."
 );

 location.href=choice
   ?"tel:+260972632701"
   :"tel:+260768217115";

};


window.startJob=async function(id){

 if(!currentUser)return;

 const job=allJobs.find(j=>j.id===id);

 if(!job)return;

 if(job.technicianId!==currentUser.uid){

   showMsg("error","You are not assigned to this job.");
   return;

 }

 if(job.status!=="accepted"){

   showMsg("error","This job cannot be started.");
   return;

 }

 if(!confirm(
   "Start this job now?\n\n"+
   "Make sure you have contacted the Mule QuickFix Manager."
 ))return;

 try{

   await update(
     ref(db,"jobs/"+id),
     {
       status:"in_progress",
       startedAt:Date.now(),
       updatedAt:Date.now()
     }
   );

   showMsg(
     "success",
     "Job started successfully."
   );

 }catch(e){

   console.error(e);

   showMsg(
     "error",
     "Could not start the job: "+e.message
   );

 }

};


window.completeJob=async function(id){

 if(!currentUser)return;

 const job=allJobs.find(j=>j.id===id);

 if(!job)return;

 if(job.technicianId!==currentUser.uid){

   showMsg("error","You are not assigned to this job.");
   return;

 }

 if(job.status!=="in_progress"){

   showMsg("error","This job is not in progress.");
   return;

 }

 const price=Number(job.estimatedPrice||0);

 if(price<=0){

   showMsg(
     "error",
     "The final job price has not been set by the CEO yet."
   );

   return;

 }

 if(!confirm(
   "Confirm that you have completed this job?\n\n"+
   "Final Job Price: "+money(price)+"\n"+
   "Mule QuickFix Commission: "+
   money(job.platformCommission)
 ))return;

 try{

   await update(
     ref(db,"jobs/"+id),
     {

       status:"completed",

       platformCommission:
         Number(
           Number(job.platformCommission||0)
           .toFixed(2)
         ),

       technicianAmount:
         Number(
           Number(job.technicianAmount||0)
           .toFixed(2)
         ),

       commissionRate:
         Number(job.commissionRate||15),

       commissionStatus:
         job.commissionStatus||"unpaid",

       completedAt:Date.now(),

       updatedAt:Date.now()

     }
   );


   showMsg(
     "success",
     "Job completed. Please pay your Mule QuickFix commission."
   );

 }catch(e){

   console.error(e);

   showMsg(
     "error",
     "Could not complete the job: "+e.message
   );

 }

};


window.payCommission=async function(id){

 if(!currentUser)return;

 const job=allJobs.find(j=>j.id===id);

 if(!job)return;

 if(job.technicianId!==currentUser.uid){

   showMsg("error","You are not assigned to this job.");
   return;

 }

 if(job.status!=="completed"){

   showMsg(
     "error",
     "Commission can only be paid after completing the job."
   );

   return;

 }

 const amount=
   Number(job.platformCommission||0);

 if(amount<=0){

   showMsg(
     "error",
     "The Mule QuickFix commission has not been calculated yet."
   );

   return;

 }


 const reference=prompt(
   "MULE QUICKFIX COMMISSION\n\n"+
   "Amount to pay: "+money(amount)+"\n\n"+
   "Pay the commission to the Mule QuickFix payment number provided by management, then enter your payment reference below:"
 );


 if(reference===null)return;

 if(!reference.trim()){

   showMsg(
     "error",
     "Please enter your payment reference."
   );

   return;

 }


 if(!confirm(
   "Submit this commission payment?\n\n"+
   "Amount: "+money(amount)+"\n"+
   "Reference: "+reference.trim()+"\n\n"+
   "CEO will verify the payment."
 ))return;


 try{

   await update(
     ref(db,"jobs/"+id),
     {

       commissionStatus:"pending",

       commissionPaymentReference:
         reference.trim(),

       commissionSubmittedAt:
         Date.now(),

       updatedAt:
         Date.now()

     }
   );


   showMsg(
     "success",
     "Commission payment submitted. Waiting for CEO confirmation."
   );

 }catch(e){

   console.error(e);

   showMsg(
     "error",
     "Could not submit payment: "+e.message
   );

 }

};


document.querySelectorAll(".tab")
.forEach(tab=>{

 tab.addEventListener("click",()=>{

   document
   .querySelectorAll(".tab")
   .forEach(x=>x.classList.remove("active"));

   tab.classList.add("active");

   currentTab=tab.dataset.tab;

   render();

 });

});


onAuthStateChanged(auth,async user=>{

 if(!user){

   location.href="../login.html";
   return;

 }

 currentUser=user;


 try{

   const userSnap=
     await get(ref(db,"users/"+user.uid));

   if(!userSnap.exists()){

     location.href="../login.html";
     return;

   }

   const userData=userSnap.val();

   if(userData.role!=="technician"){

     alert("Technician account required.");
     location.href="../index.html";
     return;

   }

   if(userData.status!=="approved"){

     jobsBox.innerHTML=`
     <div class="empty">
       <div style="font-size:35px">⏳</div>
       <h3>Account Awaiting Approval</h3>
       <p>
       Your technician account must be approved
       by Mule QuickFix management before you can
       manage jobs.
       </p>
     </div>`;

     return;

   }


   onValue(
     ref(db,"jobs"),
     snapshot=>{

       const data=snapshot.val()||{};

       allJobs=
         Object.values(data)
         .filter(j=>
           j.technicianId===currentUser.uid
         );

       render();

     },
     error=>{

       console.error(error);

       jobsBox.innerHTML=`
       <div class="empty">
         Unable to load your jobs.
       </div>`;

     }
   );


 }catch(e){

   console.error(e);

   jobsBox.innerHTML=`
   <div class="empty">
     Unable to load your account.
   </div>`;

 }

});

</script>

</body>
  </html>

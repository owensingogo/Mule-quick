<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b8f">
<title>Technician Registration | Mule QuickFix</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fc;color:#172033}
header{background:#173b8f;color:#fff;padding:15px}
.head{max-width:520px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800}
.back{color:#173b8f;background:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:bold}
main{max-width:520px;margin:auto;padding:18px 14px 40px}
.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 3px 15px #0001}
h1{margin:0 0 6px;font-size:24px;color:#173b8f}
.sub{font-size:12px;color:#667085;margin-bottom:18px}
label{display:block;font-size:12px;font-weight:bold;margin:13px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #d8deea;border-radius:9px;font-size:14px;outline:0}
input:focus,select:focus{border-color:#173b8f}
button.submit{width:100%;margin-top:18px;padding:13px;background:#173b8f;color:#fff;border:0;border-radius:10px;font-weight:bold}
.note{font-size:11px;color:#667085;background:#f4f7fc;padding:10px;border-radius:9px;margin-top:14px}
.msg{font-size:12px;margin-top:12px;text-align:center;font-weight:bold}
.success{color:#087443}.error{color:#c62828}
.login{text-align:center;font-size:12px;margin-top:16px}
.login a{color:#173b8f;font-weight:bold;text-decoration:none}
</style>
</head>
<body>

<header>
<div class="head">
<div class="logo">🔧 MULE QUICKFIX</div>
<button class="back" onclick="location.href='index.html'">HOME</button>
</div>
</header>

<main>
<div class="card">

<h1>Become a Technician</h1>
<div class="sub">
Join Mule QuickFix and connect with customers who need your skills.
</div>

<form id="form">

<label>Full Name</label>
<input id="name" type="text" placeholder="Enter your full name" required>

<label>Phone Number</label>
<input id="phone" type="tel" placeholder="e.g. 0971234567" required>

<label>Email Address</label>
<input id="email" type="email" placeholder="Enter your email" required>

<label>Main Service</label>
<select id="service" required>
<option value="">Select your service</option>
<option>Plumbing</option>
<option>Electrical</option>
<option>Mechanics</option>
<option>Phone Repair</option>
<option>Computer Repair</option>
<option>Locksmith</option>
<option>Other</option>
</select>

<label>City</label>
<select id="city" required>
<option value="">Select your city</option>
<option>Kitwe</option>
<option>Ndola</option>
<option>Lusaka</option>
<option>Chingola</option>
<option>Mufulira</option>
<option>Livingstone</option>
<option>Other</option>
</select>

<label>Years of Experience</label>
<input id="experience" type="number" min="0" max="50"
placeholder="e.g. 3" required>

<label>Password</label>
<input id="password" type="password"
placeholder="Create a password" minlength="6" required>

<label>Confirm Password</label>
<input id="confirm" type="password"
placeholder="Confirm your password" minlength="6" required>

<label>
<input id="terms" type="checkbox" style="width:auto;margin-right:6px" required>
I agree to the Mule QuickFix technician terms.
</label>

<div class="note">
🛡️ Your application will be reviewed by Mule QuickFix management.
You must be approved before you can receive customer jobs.
</div>

<button class="submit" id="submit">SUBMIT APPLICATION</button>

<div class="msg" id="msg"></div>

</form>

<div class="login">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>
</main>

<script type="module">
import{auth,db}from"./js/firebase.js";
import{createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{ref,set}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const $=id=>document.getElementById(id);
const form=$("form");
const msg=$("msg");
const submit=$("submit");

form.addEventListener("submit",async e=>{
e.preventDefault();

const name=$("name").value.trim();
const phone=$("phone").value.trim();
const email=$("email").value.trim();
const service=$("service").value;
const city=$("city").value;
const experience=Number($("experience").value);
const password=$("password").value;
const confirm=$("confirm").value;

msg.textContent="";
msg.className="msg";

if(password!==confirm){
msg.textContent="Passwords do not match.";
msg.classList.add("error");
return;
}

if(password.length<6){
msg.textContent="Password must be at least 6 characters.";
msg.classList.add("error");
return;
}

if(!phone){
msg.textContent="Please enter your phone number.";
msg.classList.add("error");
return;
}

submit.disabled=true;
submit.textContent="SUBMITTING...";

try{

const cred=await createUserWithEmailAndPassword(
auth,email,password
);

await set(ref(db,"users/"+cred.user.uid),{
uid:cred.user.uid,
fullName:name,
phone:phone,
email:email,
service:service,
city:city,
experience:experience,
role:"technician",
status:"pending",
availability:"offline",
jobsCompleted:0,
rating:0,
totalEarnings:0,
createdAt:Date.now()
});

msg.textContent=
"Application submitted successfully. Your account is pending approval.";
msg.classList.add("success");

form.reset();

setTimeout(()=>{
location.href="login.html";
},1800);

}catch(err){

console.error(err);

let text="Registration failed. Please try again.";

if(err.code==="auth/email-already-in-use")
text="This email is already registered.";

if(err.code==="auth/invalid-email")
text="Please enter a valid email address.";

if(err.code==="auth/weak-password")
text="Password is too weak.";

msg.textContent=text;
msg.classList.add("error");

submit.disabled=false;
submit.textContent="SUBMIT APPLICATION";
}

});
</script>

</body>
</html>

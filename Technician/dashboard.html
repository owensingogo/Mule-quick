<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b8f">
<title>Technician Dashboard | Mule QuickFix</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}
header{background:#173b8f;color:#fff;padding:20px 16px;border-radius:0 0 24px 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h2{margin:0;font-size:20px}
.sub{font-size:13px;opacity:.85;margin-top:5px}
main{max-width:650px;margin:auto;padding:16px 14px 35px}
.card{background:#fff;border-radius:17px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px #0000000b}
.status{display:flex;align-items:center;justify-content:space-between}
.badge{padding:7px 11px;border-radius:20px;font-size:12px;font-weight:bold}
.online{background:#e7f8ed;color:#16803d}
.offline{background:#eee;color:#667085}
.switch{position:relative;width:48px;height:27px}
.switch input{display:none}
.slider{position:absolute;inset:0;background:#cbd5e1;border-radius:30px;cursor:pointer}
.slider:before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.slider{background:#173b8f}
input:checked+.slider:before{transform:translateX(21px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#f7f9fc;border-radius:13px;padding:12px;text-align:center}
.stat b{display:block;font-size:17px;color:#173b8f}
.stat span{font-size:10px;color:#667085}
.title{font-size:17px;font-weight:bold;margin:20px 0 10px}
.job{border:1px solid #e2e7ef;border-radius:15px;padding:15px;margin-bottom:12px}
.job h3{margin:0 0 6px;font-size:16px}
.line{font-size:13px;color:#475467;margin:6px 0;line-height:1.4}
.money{background:#eef4ff;border-radius:12px;padding:10px;margin-top:10px}
.money div{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.money strong{color:#173b8f}
.urgency{font-weight:bold}
.normal{color:#16803d}
.urgent{color:#b54708}
.emergency{color:#b42318}
button{width:100%;border:0;border-radius:11px;padding:13px;margin-top:12px;background:#173b8f;color:#fff;font-weight:bold}
button:disabled{opacity:.6}
.empty{text-align:center;color:#667085;padding:25px 10px;font-size:13px}
.msg{display:none;padding:12px;border-radius:10px;margin-bottom:12px;font-size:13px}
.success{background:#e8f8ee;color:#16733a}
.error{background:#ffecec;color:#b42318}
.nav{display:flex;gap:8px;margin-top:10px}
.nav a{flex:1;text-align:center;text-decoration:none;background:#f0f4fa;color:#173b8f;padding:11px;border-radius:11px;font-size:12px;font-weight:bold}
</style>
</head>

<body>

<header>
<div class="top">
<div>
<h2>🔧 Mule QuickFix</h2>
<div class="sub">Technician Dashboard</div>
</div>

<label class="switch">
<input type="checkbox" id="onlineToggle">
<span class="slider"></span>
</label>
</div>
</header>

<main>

<div id="msg" class="msg"></div>

<div class="card">
<div class="status">
<div>
<b id="greeting">Welcome</b>
<div class="sub" style="color:#667085">Your availability</div>
</div>
<span id="statusBadge" class="badge offline">OFFLINE</span>
</div>

<div class="stats" style="margin-top:15px">
<div class="stat">
<b id="jobsDone">0</b>
<span>Jobs Done</span>
</div>

<div class="stat">
<b id="rating">0</b>
<span>Rating</span>
</div>

<div class="stat">
<b id="earnings">K0</b>
<span>Earnings</span>
</div>
</div>

<div class="nav">
<a href="jobs.html">📋 My Jobs</a>
<a href="../index.html">🏠 Home</a>
</div>
</div>

<div class="title">Available Jobs</div>

<div id="jobs">
<div class="card empty">Loading available jobs...</div>
</div>

</main>

<script type="module">

import{auth,db}from"../js/firebase.js";

import{
onAuthStateChanged
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
ref,onValue,update,get
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


let user=null;
let uid=null;
let technician=null;
let jobs={};

const $=id=>document.getElementById(id);


function message(type,text){

const m=$("msg");

m.className="msg "+type;
m.textContent=text;
m.style.display="block";

setTimeout(()=>{
m.style.display="none";
},4000);

}


function money(n){
return "K"+Number(n||0).toFixed(2);
}


/* LOAD TECHNICIAN */
onAuthStateChanged(auth,async u=>{

if(!u){
location.href="../login.html";
return;
}

user=u;
uid=u.uid;

try{

const snap=
await get(ref(db,"users/"+uid));

if(!snap.exists()){
message("error","Technician profile not found.");
return;
}

technician=snap.val();

if(technician.role!=="technician"){
message("error","This account is not a technician account.");
return;
}

$("greeting").textContent=
"Welcome, "+(technician.fullName||"Technician");

$("jobsDone").textContent=
technician.jobsCompleted||0;

$("rating").textContent=
Number(technician.rating||0).toFixed(1);

$("earnings").textContent=
money(technician.totalEarnings||0);

const online=
technician.availability==="online";

$("onlineToggle").checked=online;

setStatus(online);

if(technician.status!=="approved"){

$("jobs").innerHTML=
'<div class="card empty">⏳ Your technician account is awaiting approval. You cannot accept jobs yet.</div>';

return;

}

listenJobs();

}catch(e){

console.error(e);

message("error","Could not load technician profile.");

}

});


/* ONLINE/OFFLINE */
function setStatus(online){

const badge=$("statusBadge");

if(online){

badge.textContent="ONLINE";
badge.className="badge online";

}else{

badge.textContent="OFFLINE";
badge.className="badge offline";

}

}


$("onlineToggle").onchange=async()=>{

if(!uid)return;

const online=$("onlineToggle").checked;

try{

await update(
ref(db,"users/"+uid),
{
availability:online?"online":"offline",
updatedAt:Date.now()
}
);

setStatus(online);

message(
"success",
online
?"🟢 You are now online."
:"⚪ You are now offline."
);

}catch(e){

$("onlineToggle").checked=!online;

message(
"error",
"Could not change availability."
);

}

};


/* LOAD AVAILABLE JOBS */
function listenJobs(){

onValue(ref(db,"jobs"),snap=>{

jobs=snap.val()||{};

renderJobs();

});

}


/* DISPLAY JOBS */
function renderJobs(){

const box=$("jobs");

const available=
Object.values(jobs)
.filter(j=>
j &&
j.status==="pending" &&
!j.technicianId
);

if(!available.length){

box.innerHTML=
'<div class="card empty">🔎 No available jobs right now.<br>New requests will appear here.</div>';

return;

}

available.sort(
(a,b)=>
Number(b.createdAt||0)-
Number(a.createdAt||0)
);


box.innerHTML=available.map(j=>{

const price=
Number(j.estimatedPrice||0);

const commission=
Number(
j.platformCommission||
(price*0.15)
);

const techAmount=
Number(
j.technicianAmount||
(price-commission)
);

const budget=
Number(j.customerBudget||0);

const urgency=
j.urgency||"normal";

return `

<div class="job">

<h3>🔧 ${escapeHtml(j.service||"Service")}</h3>

<div class="line">
📍 <b>Location:</b>
${escapeHtml(j.location||"Not provided")}
</div>

<div class="line">
🏙️ <b>City:</b>
${escapeHtml(j.city||"Not provided")}
</div>

<div class="line">
📝 <b>Problem:</b>
${escapeHtml(j.description||"No description")}
</div>

<div class="line">
📞 <b>Customer:</b>
${escapeHtml(j.customerPhone||"Not provided")}
</div>

<div class="line urgency ${urgency}">
⚡ <b>Urgency:</b>
${urgency.toUpperCase()}
</div>

<div class="money">

<div>
<span>Customer budget</span>
<strong>
${budget>0?money(budget):"Not specified"}
</strong>
</div>

<div>
<span>Starting price</span>
<strong>${money(price)}</strong>
</div>

<div>
<span>Mule QuickFix</span>
<strong>${money(commission)}</strong>
</div>

<div>
<span>Your expected earnings</span>
<strong>${money(techAmount)}</strong>
</div>

</div>

<button onclick="acceptJob('${j.id}')">
✅ Accept Job
</button>

</div>

`;

}).join("");

}


/* ACCEPT JOB */
window.acceptJob=async id=>{

if(!technician||technician.status!=="approved"){

message(
"error",
"Your technician account is not approved."
);

return;

}

if(technician.availability!=="online"){

message(
"error",
"Please switch your status to ONLINE before accepting a job."
);

return;

}

const job=jobs[id];

if(!job){

message("error","Job no longer exists.");

return;

}

if(job.status!=="pending"||job.technicianId){

message(
"error",
"This job has already been taken."
);

return;

}

const price=
Number(job.estimatedPrice||0);

if(price<=0){

message(
"error",
"This job has no starting price yet."
);

return;

}

const commission=
Number(
job.platformCommission||
(price*0.15)
);

const technicianAmount=
Number(
job.technicianAmount||
(price-commission)
);


try{

await update(
ref(db,"jobs/"+id),
{
status:"accepted",
technicianId:uid,
technicianName:
technician.fullName||"Technician",

platformCommission:
Number(commission.toFixed(2)),

technicianAmount:
Number(technicianAmount.toFixed(2)),

commissionType:
job.commissionType||"percentage",

commissionRate:
Number(job.commissionRate||15),

acceptedAt:Date.now(),

updatedAt:Date.now()
}
);

message(
"success",
"✅ Job accepted successfully!"
);

}catch(e){

console.error(e);

message(
"error",
"Could not accept job: "+e.message
);

}

};


/* SAFE TEXT */
function escapeHtml(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mule QuickFix | Technician</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}
header{background:#0b5cff;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900}.logout{background:#fff;color:#0b5cff;border:0;padding:7px 9px;border-radius:7px;font-weight:bold}
main{max-width:700px;margin:auto;padding:14px}h2{margin:3px 0}.sub{font-size:12px;color:#667085;margin-bottom:14px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px #0001}
.online{display:flex;justify-content:space-between;align-items:center}.online b{color:#16a34a}
.switch{background:#e5e7eb;border:0;border-radius:20px;padding:8px 13px;font-weight:bold}.switch.on{background:#16a34a;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#f8fafc;padding:10px;border-radius:9px;text-align:center}.stat span{font-size:10px;color:#667085}.stat b{display:block;font-size:17px;margin-top:4px}
.item{border:1px solid #e5e9ef;border-radius:10px;padding:11px;margin:8px 0}.item strong{font-size:14px}
.meta{font-size:11px;color:#667085;line-height:1.7;margin-top:5px}.money{background:#f8fafc;padding:9px;border-radius:9px;margin-top:8px;font-size:12px;line-height:1.8}
.earn{color:#16a34a;font-size:14px}.commission{color:#dc2626}
button.action{background:#0b5cff;color:#fff;border:0;border-radius:8px;padding:10px;width:100%;margin-top:8px;font-weight:bold}
.empty{text-align:center;color:#667085;font-size:12px;padding:15px}.error{display:none;background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px}
</style>
</head>

<body>

<header>
<div class="logo">🔧 MULE QUICKFIX</div>
<button class="logout" id="logout">Logout</button>
</header>

<main>

<div id="error" class="error"></div>

<h2 id="greeting">Technician 👷</h2>
<div class="sub">Find jobs, manage your work and track your earnings.</div>

<div class="card online">
<div>Availability<br><b id="status">OFFLINE</b></div>
<button class="switch" id="toggle">Go Online</button>
</div>

<div class="card stats">
<div class="stat"><span>Jobs Done</span><b id="done">0</b></div>
<div class="stat"><span>Rating</span><b id="rating">0 ⭐</b></div>
<div class="stat"><span>Earnings</span><b id="earnings">K0</b></div>
</div>

<div class="card">
<h3>🛠️ Available Jobs</h3>
<div id="available">Loading...</div>
</div>

<div class="card">
<h3>📋 My Jobs</h3>
<button class="action" onclick="location.href='jobs.html'">
Open My Jobs
</button>
</div>

</main>

<script type="module">

import{auth,db}from"../js/firebase.js";
import{onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{ref,onValue,update}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const $=id=>document.getElementById(id);
let uid="",user={},jobs={},commission={type:"percentage",value:15};

function esc(v){
return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function error(t){
$("error").textContent=t;
$("error").style.display="block";
setTimeout(()=>$("error").style.display="none",4000);
}

function calc(price){
price=Number(price)||0;
let c=commission.type==="percentage"
?price*commission.value/100
:Math.min(price,commission.value);
return{price,commission:c,technician:price-c};
}

$("logout").onclick=async()=>{
await signOut(auth);
location.href="../login.html";
};

onAuthStateChanged(auth,u=>{

if(!u){
location.href="../login.html";
return;
}

uid=u.uid;

onValue(ref(db,"users/"+uid),s=>{

user=s.val();

if(!user||user.role!=="technician"){
error("This account is not a technician.");
return;
}

if(user.status!=="approved"){
error("Your technician account is waiting for approval.");
return;
}

$("greeting").textContent="Hello, "+(user.fullName||"Technician")+" 👷";
$("done").textContent=user.jobsCompleted||0;
$("rating").textContent=(user.rating||0)+" ⭐";
$("earnings").textContent="K"+Number(user.totalEarnings||0).toFixed(2);

setOnline(user.availability==="online");

});

onValue(ref(db,"settings/commission"),s=>{
let x=s.val();
if(x)commission={
type:x.type||"percentage",
value:Number(x.value||0)
};
render();
});

onValue(ref(db,"jobs"),s=>{
jobs=s.val()||{};
render();
});

});

function setOnline(on){

$("status").textContent=on?"ONLINE":"OFFLINE";
$("status").style.color=on?"#16a34a":"#dc2626";
$("toggle").textContent=on?"Go Offline":"Go Online";
$("toggle").classList.toggle("on",on);

}

$("toggle").onclick=async()=>{

let on=user.availability!=="online";

try{

await update(ref(db,"users/"+uid),{
availability:on?"online":"offline",
updatedAt:Date.now()
});

user.availability=on?"online":"offline";
setOnline(on);

}catch(e){
error(e.message);
}

};

function render(){

let list=Object.entries(jobs).filter(([id,j])=>
j.status==="pending"&&
!j.technicianId
);

if(user.availability!=="online"){
$("available").innerHTML=
'<div class="empty">Go online to receive available jobs.</div>';
return;
}

if(!list.length){
$("available").innerHTML=
'<div class="empty">No available jobs right now.</div>';
return;
}

$("available").innerHTML=list.slice(0,30).map(([id,j])=>{

let r=calc(j.estimatedPrice);

return`

<div class="item">

<strong>🔧 ${esc(j.service||"Service")}</strong>

<div class="meta">
📍 ${esc(j.location||"—")}, ${esc(j.city||"—")}<br>
🚨 ${esc(j.urgency||"normal")}<br>
📝 ${esc(j.description||"No description")}
</div>

<div class="money">
💵 Job Price: <b>K${r.price.toFixed(2)}</b><br>
<span class="commission">
Mule QuickFix: K${r.commission.toFixed(2)}
</span><br>
<span class="earn">
👷 Your Earnings: <b>K${r.technician.toFixed(2)}</b>
</span>
</div>

${r.price>0?`
<button class="action" onclick="acceptJob('${id}')">
✓ Accept Job
</button>`:`
<div class="meta">
⏳ Price has not been set by CEO yet.
</div>`}

</div>

`;

}).join("");

}

window.acceptJob=async id=>{

let j=jobs[id];

if(!j||j.status!=="pending"){
error("This job is no longer available.");
return;
}

if(!user.availability||user.availability!=="online"){
error("Go online before accepting a job.");
return;
}

if(!j.estimatedPrice||Number(j.estimatedPrice)<=0){
error("The CEO has not set the price yet.");
return;
}

let r=calc(j.estimatedPrice);

if(!confirm(
"Accept this job?\n\n"+
"Job Price: K"+r.price.toFixed(2)+
"\nYour Earnings: K"+r.technician.toFixed(2)
))return;

try{

await update(ref(db,"jobs/"+id),{
status:"accepted",
technicianId:uid,
technicianName:user.fullName||"Technician",
platformCommission:Number(r.commission.toFixed(2)),
technicianAmount:Number(r.technician.toFixed(2)),
commissionType:commission.type,
commissionRate:commission.value,
acceptedAt:Date.now(),
updatedAt:Date.now()
});

alert("✅ Job accepted!");
location.href="jobs.html";

}catch(e){
error("Could not accept job: "+e.message);
}

};

</script>

</body>
</html>

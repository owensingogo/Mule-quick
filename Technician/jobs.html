<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mule QuickFix | My Jobs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}
header{background:#0b5cff;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900}.back{background:#fff;color:#0b5cff;border:0;padding:7px;border-radius:7px;font-weight:bold}
main{max-width:700px;margin:auto;padding:14px}h2{margin:3px 0}.sub{font-size:12px;color:#667085;margin-bottom:14px}
.card{background:#fff;border-radius:14px;padding:13px;margin-bottom:12px;box-shadow:0 3px 12px #0001}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.tab{border:0;padding:8px 10px;border-radius:8px;background:#eef2f7;white-space:nowrap;font-weight:bold}.tab.active{background:#0b5cff;color:#fff}
.item{border:1px solid #e5e9ef;border-radius:10px;padding:11px;margin:8px 0}
.item strong{font-size:14px}.meta{font-size:11px;color:#667085;line-height:1.7;margin-top:5px}
.money{background:#f8fafc;border-radius:9px;padding:10px;margin-top:8px;font-size:12px;line-height:1.9}
.earn{color:#16a34a;font-size:15px}.commission{color:#dc2626}
button.action{border:0;border-radius:8px;padding:9px 12px;margin-top:8px;background:#0b5cff;color:#fff;font-weight:bold}
.complete{background:#16a34a!important}.empty{text-align:center;color:#667085;font-size:12px;padding:15px}
.error{display:none;background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px}
</style>
</head>

<body>

<header>
<div class="logo">🔧 MULE QUICKFIX</div>
<button class="back" onclick="location.href='dashboard.html'">Dashboard</button>
</header>

<main>

<div id="error" class="error"></div>

<h2>My Jobs 👷</h2>
<div class="sub">Manage your assigned jobs and track your earnings.</div>

<div class="card">

<div class="tabs">
<button class="tab active" data-tab="active">Active</button>
<button class="tab" data-tab="progress">In Progress</button>
<button class="tab" data-tab="completed">Completed</button>
</div>

<div id="list">Loading jobs...</div>

</div>

</main>

<script type="module">

import{auth,db}from"../js/firebase.js";
import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{ref,onValue,update}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const $=id=>document.getElementById(id);
let jobs={},uid="",tab="active";

function esc(v){
return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function error(t){
$("error").textContent=t;
$("error").style.display="block";
setTimeout(()=>$("error").style.display="none",4000);
}

onAuthStateChanged(auth,u=>{

if(!u){
location.href="../login.html";
return;
}

uid=u.uid;

onValue(ref(db,"users/"+uid),s=>{

let user=s.val();

if(!user||user.role!=="technician"){
error("This account is not registered as a technician.");
return;
}

if(user.status!=="approved"){
error("Your technician account is not approved yet.");
return;
}

loadJobs();

});

});

function loadJobs(){

onValue(ref(db,"jobs"),s=>{
jobs=s.val()||{};
render();
},e=>error("Could not load jobs: "+e.message));

}

function render(){

let list=Object.entries(jobs).filter(([id,j])=>
j.technicianId===uid
);

if(tab==="active")
list=list.filter(x=>x[1].status==="accepted");

if(tab==="progress")
list=list.filter(x=>x[1].status==="in_progress");

if(tab==="completed")
list=list.filter(x=>x[1].status==="completed");

list.sort((a,b)=>
Number(b[1].updatedAt||0)-Number(a[1].updatedAt||0)
);

if(!list.length){
$("list").innerHTML='<div class="empty">No jobs in this section.</div>';
return;
}

$("list").innerHTML=list.map(([id,j])=>{

let price=Number(j.estimatedPrice||0);
let commission=Number(j.platformCommission||0);
let earnings=Number(j.technicianAmount||0);

return`

<div class="item">

<strong>🔧 ${esc(j.service||"Service")}</strong>

<div class="meta">
👤 Customer: ${esc(j.customerName||"—")}<br>
📞 ${esc(j.customerPhone||"—")}<br>
📍 ${esc(j.location||"—")}, ${esc(j.city||"—")}<br>
🚨 ${esc(j.urgency||"normal")}
</div>

<div class="money">
💵 Job Price: <b>K${price.toFixed(2)}</b><br>
<span class="commission">Mule QuickFix: K${commission.toFixed(2)}</span><br>
<span class="earn">👷 Your Earnings: <b>K${earnings.toFixed(2)}</b></span>
</div>

<div class="meta">
📝 ${esc(j.description||"No description")}
</div>

${j.status==="accepted"?`
<button class="action" onclick="startJob('${id}')">
▶️ Start Job
</button>`:""}

${j.status==="in_progress"?`
<button class="action complete" onclick="completeJob('${id}')">
✓ Complete Job
</button>`:""}

<span style="display:block;margin-top:7px;font-size:10px;color:#667085">
Status: ${esc(j.status||"—")}
</span>

</div>

`;

}).join("");

}

window.startJob=async id=>{

if(!confirm("Start this job now?"))return;

try{

await update(ref(db,"jobs/"+id),{
status:"in_progress",
startedAt:Date.now(),
updatedAt:Date.now()
});

}catch(e){
error(e.message);
}

};

window.completeJob=async id=>{

if(!confirm("Mark this job as completed?"))return;

try{

await update(ref(db,"jobs/"+id),{
status:"completed",
completedAt:Date.now(),
updatedAt:Date.now()
});

}catch(e){
error(e.message);
}

};

document.querySelectorAll("[data-tab]").forEach(b=>{

b.onclick=()=>{
document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
tab=b.dataset.tab;
render();
};

});

</script>

</body>
  </html>

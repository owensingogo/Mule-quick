<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Jobs | Mule QuickFix</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#0b5cff;color:#fff;padding:16px}
.head{max-width:700px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:18px}
.logout{border:0;background:#ffffff20;color:#fff;padding:9px 12px;border-radius:10px;font-weight:bold}
main{max-width:700px;margin:auto;padding:20px 15px 100px}
h1{font-size:25px;margin:0 0 5px}
.sub{color:#687386;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:20px 0 15px}
.tab{border:0;padding:11px 5px;border-radius:11px;background:#fff;color:#687386;font-weight:bold}
.tab.active{background:#0b5cff;color:#fff}
.job{background:#fff;border-radius:18px;padding:17px;margin:11px 0;box-shadow:0 4px 15px #1720330b}
.top{display:flex;justify-content:space-between;gap:8px}
.service{font-weight:900;font-size:16px}
.badge{font-size:10px;padding:6px 8px;border-radius:8px;background:#eef4ff;color:#0b5cff;font-weight:bold}
.info{font-size:13px;color:#687386;line-height:1.7;margin-top:9px}
.desc{font-size:13px;line-height:1.5;margin:8px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{border:0;padding:12px;border-radius:11px;font-weight:bold;cursor:pointer}
.primary{background:#0b5cff;color:#fff}
.green{background:#16a34a;color:#fff}
.gray{background:#e9edf3;color:#344054}
.empty{text-align:center;background:#fff;padding:35px 18px;border-radius:18px;color:#687386;line-height:1.5}
.loading{text-align:center;color:#687386;padding:30px}
nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:center}
.nav{max-width:700px;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{border:0;background:#fff;color:#687386;font-weight:bold;font-size:11px}
.nav button:nth-child(2){color:#0b5cff}
.nav span{display:block;font-size:21px;margin-bottom:3px}
</style>
</head>

<body>

<header>
<div class="head">
<div class="logo">🔧 MULE QUICKFIX</div>
<button class="logout" id="logout">Logout</button>
</div>
</header>

<main>

<h1>My Jobs</h1>
<p class="sub">Manage your accepted and completed jobs.</p>

<div class="tabs">
<button class="tab active" data-filter="accepted">Active</button>
<button class="tab" data-filter="in_progress">Progress</button>
<button class="tab" data-filter="completed">Completed</button>
</div>

<div id="list">
<div class="loading">Loading your jobs...</div>
</div>

</main>

<nav>
<div class="nav">
<button onclick="location.href='dashboard.html'">
<span>🏠</span>Home
</button>
<button onclick="location.href='jobs.html'">
<span>🛠️</span>My Jobs
</button>
<button onclick="alert('Profile coming next')">
<span>👤</span>Profile
</button>
</div>
</nav>

<script type="module">

import{auth,db}from"../js/firebase.js";
import{onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{ref,get,onValue,update,query,orderByChild,equalTo}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

let user;
let currentFilter="accepted";
const $=x=>document.getElementById(x);

onAuthStateChanged(auth,async u=>{

if(!u){location.href="../login.html";return}

user=u;

const s=await get(ref(db,"users/"+u.uid));

if(!s.exists()||s.val().role!=="technician"){
location.href="../login.html";
return;
}

loadJobs();

});

document.querySelectorAll(".tab").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
currentFilter=btn.dataset.filter;
loadJobs();
};
});

function loadJobs(){

const q=query(
ref(db,"jobs"),
orderByChild("technicianId"),
equalTo(user.uid)
);

onValue(q,s=>{

$("list").innerHTML="";

let found=false;

if(s.exists()){

s.forEach(x=>{

const j=x.val();

if(j.status===currentFilter){

found=true;
render(j);

}

});

}

if(!found){

$("list").innerHTML=`
<div class="empty">
<div style="font-size:40px">🛠️</div>
<br>
<strong>No ${currentFilter.replace("_"," ")} jobs</strong>
<br>
Your jobs will appear here when their status changes.
</div>`;

}

});

}

function render(j){

const d=document.createElement("div");
d.className="job";

let next="";

if(j.status==="accepted"){

next=`
<button class="btn primary"
onclick="startJob('${j.id}')">
Start Job
</button>`;

}

if(j.status==="in_progress"){

next=`
<button class="btn green"
onclick="completeJob('${j.id}')">
Mark Completed
</button>`;

}

d.innerHTML=`

<div class="top">

<div class="service">
${safe(j.service||"Service")}
</div>

<div class="badge">
${safe(j.status.replace("_"," ").toUpperCase())}
</div>

</div>

<div class="desc">
${safe(j.description||"No description")}
</div>

<div class="info">
👤 ${safe(j.customerName||"Customer")}<br>
📞 ${safe(j.customerPhone||"Not provided")}<br>
📍 ${safe(j.location||"")}<br>
🏙️ ${safe(j.city||"")}
</div>

<div class="actions">

${next}

<button class="btn gray"
onclick="viewJob('${j.id}')">
View Details
</button>

</div>
`;

$("list").appendChild(d);

}

window.startJob=async id=>{

if(!confirm("Start this job now?"))return;

await update(
ref(db,"jobs/"+id),
{
status:"in_progress",
startedAt:Date.now(),
updatedAt:Date.now()
}
);

};

window.completeJob=async id=>{

if(!confirm("Mark this job as completed?"))return;

await update(
ref(db,"jobs/"+id),
{
status:"completed",
completedAt:Date.now(),
updatedAt:Date.now()
}
);

};

window.viewJob=async id=>{

const s=await get(ref(db,"jobs/"+id));

if(!s.exists())return;

const j=s.val();

alert(
"Service: "+j.service+
"\n\nProblem: "+j.description+
"\n\nCustomer: "+j.customerName+
"\nPhone: "+j.customerPhone+
"\nLocation: "+j.location+
", "+j.city+
"\n\nStatus: "+j.status
);

};

function safe(v){

return String(v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

}

$("logout").onclick=async()=>{
await signOut(auth);
location.href="../login.html";
};

</script>

</body>
</html>
